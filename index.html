<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Bibi Plans — Auto-plan My Day (Prototype)</title>
  <link rel="stylesheet" href="assets/styles.css" />
  <link rel="manifest" href="manifest.json" />
</head>
<body>
  <header class="app-header">
    <h1>Bibi Plans — Auto-plan My Day</h1>
    <p class="tag">Prototype: local-first planner that suggests study blocks for today.</p>
  </header>

  <main class="container">
    <section class="panel">
      <h2>Availability</h2>
      <form id="availability-form">
        <label>Start time:
          <input type="time" id="avail-start" value="17:00" required />
        </label>
        <label>End time:
          <input type="time" id="avail-end" value="21:00" required />
        </label>
        <label>Block length:
          <select id="block-length">
            <option value="25">25 min (Pomodoro)</option>
            <option value="30" selected>30 min</option>
            <option value="45">45 min</option>
          </select>
        </label>
        <button type="submit">Save availability</button>
      </form>
    </section>

    <section class="panel">
      <h2>Add Assignment</h2>
      <form id="task-form">
        <input id="task-title" placeholder="Title (e.g. Math worksheet)" required />
        <input id="task-due" type="date" required />
        <input id="task-effort" type="number" min="5" step="5" value="30" required />
        <select id="task-priority">
          <option value="3">High</option>
          <option value="2" selected>Medium</option>
          <option value="1">Low</option>
        </select>
        <button type="submit">Add</button>
      </form>

      <div id="tasks-list" class="list"></div>
    </section>

    <section class="panel">
      <h2>Auto-plan</h2>
      <p>Choose date to plan (default: today)</p>
      <input type="date" id="plan-date" />
      <button id="plan-button">Auto-plan My Day</button>
      <div id="plan-result" class="list"></div>
    </section>
  </main>

  <footer class="footer">
    <small>Prototype — data stored in your browser (localStorage).</small>
  </footer>

  <script src="src/app.js"></script>
</body>
</html>
